name: Android build and speech checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android platform in cloud
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Check unchanged UI copy
        run: python3 scripts/audit-ui.py
      - name: Compile, unit tests and lint
        run: bash ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug
      - name: Build original-key signed Release
        if: github.event_name != 'pull_request'
        env:
          DUBAO_KEYSTORE_BASE64: ${{ secrets.DUBAO_KEYSTORE_BASE64 }}
          DUBAO_STORE_PASSWORD: ${{ secrets.DUBAO_STORE_PASSWORD }}
          DUBAO_KEY_PASSWORD: ${{ secrets.DUBAO_KEY_PASSWORD }}
          DUBAO_KEY_ALIAS: ${{ secrets.DUBAO_KEY_ALIAS }}
        run: |
          bash scripts/cloud-build.sh release
          python3 scripts/verify-release.py app/build/outputs/apk/release/app-release.apk
      - name: Real online speech protocol check
        id: online
        continue-on-error: true
        env:
          DUBAO_LIVE_SPEECH: '1'
        run: |
          cp -r app/build/reports/tests/testDebugUnitTest app/build/reports/tests/offline-regression
          bash ./gradlew --no-daemon --console=plain testDebugUnitTest --tests com.newspaper.helper.LiveSpeechTest
      - name: Record live service outcome
        if: always()
        run: echo 'Live speech check outcome is ${{ steps.online.outcome }}. This is separate from build and offline tests.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable cloud emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android topbar and online playback checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1080x2160
          script: |
            adb shell wm size reset
            adb shell wm density 540
            adb shell wm size
            adb shell wm density
            bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newspaper.helper.NativeUiTest,com.newspaper.helper.TopBarUiTest,com.newspaper.helper.NotesUiTest,com.newspaper.helper.NavigationTransitionTest,com.newspaper.helper.CaptionReadingUiTest -Pandroid.testInstrumentationRunnerArguments.expectedWidth=320
            mkdir -p app/build/topbar-evidence/reports-320
            cp -r app/build/reports/androidTests/. app/build/topbar-evidence/reports-320/
            adb shell wm density 443
            adb shell wm size
            adb shell wm density
            bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newspaper.helper.NativeUiTest,com.newspaper.helper.TopBarUiTest,com.newspaper.helper.NotesUiTest,com.newspaper.helper.NavigationTransitionTest,com.newspaper.helper.CaptionReadingUiTest -Pandroid.testInstrumentationRunnerArguments.expectedWidth=390
            mkdir -p app/build/topbar-evidence/reports-390
            cp -r app/build/reports/androidTests/. app/build/topbar-evidence/reports-390/
            adb shell settings put global animator_duration_scale 1
            adb shell settings put global transition_animation_scale 1
            adb shell settings put global window_animation_scale 1
            bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newspaper.helper.NotesUiTest,com.newspaper.helper.NavigationTransitionTest,com.newspaper.helper.NavigationColorFlashTest -Pandroid.testInstrumentationRunnerArguments.expectedWidth=390
            mkdir -p app/build/topbar-evidence/reports-motion
            cp -r app/build/reports/androidTests/. app/build/topbar-evidence/reports-motion/
            adb shell settings put global animator_duration_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global window_animation_scale 0
            adb pull /sdcard/Download/dubao-topbar-evidence app/build/topbar-evidence/screenshots
            bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newspaper.helper.SpeechCacheTest
            mkdir -p app/build/speech-cache-evidence
            cp -r app/build/reports/androidTests/. app/build/speech-cache-evidence/
            if [ '${{ steps.online.outcome }}' = 'success' ]; then bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newspaper.helper.OnlinePlaybackTest && adb pull /sdcard/Download/dubao-online-evidence app/build/speech-evidence/android; fi
            if [ -f app/build/outputs/apk/release/app-release.apk ]; then bash scripts/release-smoke.sh; fi
      - name: Upload APK and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubao-2.0.3-validation-${{ github.sha }}
          retention-days: 3
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/androidTests/
            app/build/speech-evidence/
            app/build/speech-cache-evidence/
            app/build/topbar-evidence/
            app/build/outputs/androidTest-results/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/release-evidence/
      - name: Upload verified Release APK
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dubao-2.0.3-release-${{ github.sha }}
          retention-days: 7
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/release-evidence/verification.json
          if-no-files-found: error
      - name: Publish verified 2.0.3 Release
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.online.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare-release.py
          if gh release view v2.0.3 >/dev/null 2>&1; then
            echo 'Release already exists; keeping the published assets.'
            exit 0
          fi
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; leaving publication to its verified build.'
            exit 0
          fi
          gh release create v2.0.3 \
            --target "$GITHUB_SHA" --title '读报 2.0.3' --latest \
            --notes-file app/build/release-evidence/publish/release-validation.md \
            app/build/release-evidence/publish/dubao-2.0.3-release.apk \
            app/build/release-evidence/publish/dubao-2.0.3-release.apk.sha256 \
            app/build/release-evidence/publish/release-validation.json \
            app/build/release-evidence/publish/release-validation.md
