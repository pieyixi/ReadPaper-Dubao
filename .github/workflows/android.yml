name: Android build and speech checks
on:
  push:
    branches: [codex/free-online-speech]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android platform in cloud
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Check unchanged UI copy
        run: python3 scripts/audit-ui.py
      - name: Compile, unit tests and lint
        run: bash ./gradlew --no-daemon --console=plain assembleDebug testDebugUnitTest lintDebug
      - name: Real online speech protocol check
        id: online
        continue-on-error: true
        env:
          DUBAO_LIVE_SPEECH: '1'
        run: |
          cp -r app/build/reports/tests/testDebugUnitTest app/build/reports/tests/offline-regression
          bash ./gradlew --no-daemon --console=plain testDebugUnitTest --tests com.newspaper.helper.LiveSpeechTest
      - name: Record live service outcome
        if: always()
        run: echo 'Live speech check outcome is ${{ steps.online.outcome }}. This is separate from build and offline tests.' >> "$GITHUB_STEP_SUMMARY"
      - name: Enable cloud emulator acceleration
        if: steps.online.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android online playback checks
        if: steps.online.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash ./gradlew --no-daemon --console=plain connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.newspaper.helper.OnlinePlaybackTest
            adb pull /sdcard/Download/dubao-online-evidence app/build/speech-evidence/android
      - name: Upload APK and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dubao-2.0.1-debug-${{ github.sha }}
          retention-days: 3
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/androidTests/
            app/build/speech-evidence/
            app/build/test-results/testDebugUnitTest/
